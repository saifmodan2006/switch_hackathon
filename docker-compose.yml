name: switchops
x-business: &business
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  env_file: .env
  environment: &business-env
    DATABASE_URL: postgresql+asyncpg://switchops:${POSTGRES_PASSWORD:?Run scripts/init_env.py}@postgres:5432/switchops
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-switchops}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    SMTP_SANDBOX: 'true'
    MODEL_BASE_URL: ${DOCKER_MODEL_BASE_URL:-http://host.docker.internal:11434}
  extra_hosts: ["host.docker.internal:host-gateway"]
  restart: unless-stopped
  networks: [business]
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: switchops
      POSTGRES_USER: switchops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchops -d switchops"]
      interval: 5s
      retries: 15
    restart: unless-stopped
    networks: [business]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [business]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-switchops}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run scripts/init_env.py}
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:9101:9001"]
    restart: unless-stopped
    networks: [business]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
    networks: [business]
  migrate:
    <<: *business
    command: ["alembic", "upgrade", "head"]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *business
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 10
  agents:
    <<: *business
    command: ["python", "-m", "agents.runtime.engine"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      disable: true
  worker:
    <<: *business
    command: ["arq", "app.workers.jobs.WorkerSettings"]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.jobs.WorkerSettings"]
      interval: 30s
      retries: 3
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 10
    restart: unless-stopped
    networks: [business]
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [local-ai]
    volumes: ["ollama-data:/root/.ollama"]
    ports: ["127.0.0.1:11434:11434"]
    restart: unless-stopped
    networks: [business]
networks:
  business:
volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
