name: SwitchOps checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements.txt
      - run: PYTHONPATH=services/api:services alembic upgrade head
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: python -m venv .venv && .venv/bin/pip install -r services/api/requirements.txt
      - run: .venv/bin/python scripts/init_env.py
      - run: npm ci --prefix apps/web
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: npm run test:e2e --prefix apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: 'docs/screenshots/'}
